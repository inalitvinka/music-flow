<h2 class="title">Change Password</h2>
<form [formRoot]="passwordForm" (submit)="onSubmit()" class="form">
  <player-form-textfield
    type="password"
    [formField]="passwordForm.currentPassword"
    placeholder="Current Password"
    [invalid]="passwordForm.currentPassword().touched() && passwordForm.currentPassword().invalid()"
  />
  <player-form-textfield
    type="password"
    [formField]="passwordForm.password"
    placeholder="New Password"
    [invalid]="passwordForm.password().touched() && passwordForm.password().invalid()"
  />
  <player-form-textfield
    type="password"
    [formField]="passwordForm.confirmPassword"
    placeholder="Confirm Password"
    [invalid]="passwordForm.confirmPassword().touched() && passwordForm.confirmPassword().invalid()"
  />
  @if (serverError()) {
    <div class="server-error">
      <player-sprite icon="error-outlined" class="icon" />
      <p>{{ serverError() }}</p>
    </div>
  }
  <button
    playerButton
    type="submit"
    [variant]="'secondary'"
    class="submit"
    [loading]="isLoading()"
    [disabled]="!!serverError()"
  >
    Save
  </button>
</form>
