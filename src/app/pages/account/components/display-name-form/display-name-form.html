<h2 class="title">Change name</h2>
<form [formRoot]="nameForm" (submit)="onSubmit()" class="form">
  <player-form-textfield
    [formField]="nameForm.name"
    placeholder="New Name"
    [invalid]="nameForm.name().touched() && nameForm.name().invalid()"
  />
  @if (serverError()) {
    <div class="server-error">
      <player-sprite icon="error-outlined" class="icon" />
      <p>{{ serverError() }}</p>
    </div>
  }
  <button
    playerButton
    type="submit"
    variant="secondary"
    class="submit"
    [loading]="isLoading()"
    [disabled]="!!serverError()"
  >
    Save
  </button>
</form>
