<!-- eslint-disable @angular-eslint/template/elements-content -->
<header class="header">
  <div class="wrapper">
    <tui-textfield iconStart="@tui.search" [tuiTextfieldCleaner]="false" class="search-bar">
      <input placeholder="Search for tracks..." tuiInput [(ngModel)]="searchService.query" />
      <button tuiButtonX size="xl" (click)="searchService.query.set('')"></button>
    </tui-textfield>
    @if (viewportService.isMobile()) {
      <button
        #menuButton
        playerButton
        variant="base"
        icon="menu-kebab-vert"
        (click)="openMenu()"
      ></button>
    } @else if (authService.isAuthenticated()) {
      <ng-template #profileTrigger>
        {{ userNameInitial() }}
      </ng-template>
      <player-context-menu size="small" variant="profile" [triggerTemplate]="profileTrigger">
        <button tuiOption type="button" routerLink="/account">
          <player-sprite icon="account" />
          <span>Account</span>
        </button>
        <button tuiOption type="button" (click)="logout()">
          <player-sprite icon="logout" />
          <span>Log out</span>
        </button>
      </player-context-menu>
    } @else {
      <button
        playerButton
        size="small"
        routerLinkActive
        routerLink="/login"
        #rla="routerLinkActive"
        [disabled]="rla.isActive"
      >
        Login
      </button>
    }
  </div>
</header>
